name: Cachix

on:
  push:
    branches:
      - main
    paths:
      - '**'
      - '!.github/**'
      - '.github/workflows/cachix.yaml'
  workflow_dispatch:
    inputs:
      verbose:
        description: Enable verbose logging for Nix builds
        required: false
        default: false
        type: boolean

jobs:
  linux:
    runs-on: ubuntu-latest
    env:
      VERBOSE_FLAGS: ${{ inputs.verbose == true && '--verbose --print-build-logs' || '' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          nix_path: nixpkgs=channel:nixpkgs-unstable

      - name: Setup Cachix
        uses: cachix/cachix-action@3ba601ff5bbb07c7220846facfa2cd81eeee15a1 # v16
        with:
          name: anthonyenr1quez
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - run: nix flake archive

      - run: nix build --accept-flake-config .#nixosConfigurations.mothership.config.system.build.toplevel $VERBOSE_FLAGS

  arm-linux:
    # Builds each aarch64-linux agent-sandbox micro VM system closure and pushes
    # them to cachix, so the macOS hosts can substitute them via `microvm-run`
    # instead of running the local linux-builder. The vfkit runners themselves
    # are aarch64-darwin and are built in the arm-macos job below.
    runs-on: ubuntu-24.04-arm
    env:
      VERBOSE_FLAGS: ${{ inputs.verbose == true && '--verbose --print-build-logs' || '' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          nix_path: nixpkgs=channel:nixpkgs-unstable

      - name: Setup Cachix
        uses: cachix/cachix-action@3ba601ff5bbb07c7220846facfa2cd81eeee15a1 # v16
        with:
          name: anthonyenr1quez
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      # One build shares dependencies and builds independent closures concurrently.
      # The resulting paths are still pushed before arm-macos starts.
      - run: >-
          nix build --accept-flake-config
          .#nixosConfigurations.agent-sandbox-damascus.config.system.build.toplevel
          .#nixosConfigurations.agent-sandbox-MacBook-Pro-2.config.system.build.toplevel
          .#packages.aarch64-linux.agent-sandbox-damascus-runner-deps
          .#packages.aarch64-linux.agent-sandbox-MacBook-Pro-2-runner-deps
          $VERBOSE_FLAGS

  arm-macos:
    # Depends on arm-linux so the aarch64-linux VM closure is in cachix first;
    # the aarch64-darwin vfkit runner can then substitute it instead of needing
    # a local linux-builder on the runner.
    needs: arm-linux
    runs-on: macos-26
    env:
      VERBOSE_FLAGS: ${{ inputs.verbose == true && '--verbose --print-build-logs' || '' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          nix_path: nixpkgs=channel:nixpkgs-unstable

      - name: Setup Cachix
        uses: cachix/cachix-action@3ba601ff5bbb07c7220846facfa2cd81eeee15a1 # v16
        with:
          name: anthonyenr1quez
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      # Build all Darwin outputs together so Nix can share and parallelize work.
      - run: >-
          nix build --accept-flake-config
          .#darwinConfigurations.MacBook-Pro-2.config.system.build.toplevel
          .#darwinConfigurations.damascus.config.system.build.toplevel
          .#nixosConfigurations.agent-sandbox-damascus.config.microvm.declaredRunner
          .#nixosConfigurations.agent-sandbox-MacBook-Pro-2.config.microvm.declaredRunner
          $VERBOSE_FLAGS
